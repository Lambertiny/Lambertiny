<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
<stop offset="0%" stop-color="#090A0F"/><stop offset="55%" stop-color="#11131B"/><stop offset="100%" stop-color="#171321"/>
</linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop offset="0%" stop-color="#FF8C42"/><stop offset="55%" stop-color="#E91E63"/><stop offset="100%" stop-color="#7B61FF"/></linearGradient>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.muted{fill:#8D92A3}.light{fill:#F5F6FA}.orange{fill:#FF8C42}.pink{fill:#E91E63}.violet{fill:#7B61FF}.line{stroke:#2A2E3A;stroke-width:1}
.pulse{animation:pulse 1.8s ease-in-out infinite}.pulse2{animation:pulse 1.8s ease-in-out .6s infinite}.pulse3{animation:pulse 1.8s ease-in-out 1.2s infinite}
.scan{animation:scan 5s linear infinite}.dash{stroke-dasharray:8 10;animation:dash 5s linear infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%{transform:translateX(-400px)}100%{transform:translateX(1600px)}}@keyframes dash{to{stroke-dashoffset:-90}}
</style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#252938"/>
<rect x="44" y="38" width="8" height="8" rx="4" class="pulse orange"/><rect x="60" y="38" width="8" height="8" rx="4" class="pulse2 pink"/><rect x="76" y="38" width="8" height="8" rx="4" class="pulse3 violet"/>
<text x="104" y="48" class="mono muted" font-size="14" letter-spacing="3">LAMBERTINY / CREATIVE TECHNOLOGY LAB</text>
<text x="44" y="120" class="sans light" font-size="46" font-weight="700">Systems, interfaces and intelligent workflows.</text>
<text x="44" y="158" class="sans muted" font-size="20">Systems Analysis • Product Design • Front-End • AI &amp; Automation</text>
<line x1="44" y1="196" x2="1156" y2="196" class="line"/>
<g transform="translate(44 226)">
<text class="mono muted" font-size="12" letter-spacing="2">SYSTEM STATUS</text>
<circle cx="8" cy="38" r="5" fill="#43D17A" class="pulse"/><text x="24" y="43" class="mono light" font-size="14">DESIGN SYSTEMS</text><text x="186" y="43" class="mono" fill="#43D17A" font-size="14">ONLINE</text>
<circle cx="330" cy="38" r="5" fill="#43D17A" class="pulse2"/><text x="346" y="43" class="mono light" font-size="14">FRONT-END</text><text x="453" y="43" class="mono" fill="#43D17A" font-size="14">ACTIVE</text>
<circle cx="570" cy="38" r="5" fill="#FFB44A" class="pulse3"/><text x="586" y="43" class="mono light" font-size="14">AI + AUTOMATION</text><text x="742" y="43" class="mono" fill="#FFB44A" font-size="14">EXPLORING</text>
<circle cx="904" cy="38" r="5" fill="#43D17A" class="pulse"/><text x="920" y="43" class="mono light" font-size="14">PRODUCT</text><text x="1004" y="43" class="mono" fill="#43D17A" font-size="14">ACTIVE</text>
</g>
<g transform="translate(44 314)">
<text class="mono muted" font-size="12" letter-spacing="2">CURRENT BUILDS</text>
<text x="156" y="0" class="mono light" font-size="13">01 BRIEF//AI</text><text x="308" y="0" class="mono light" font-size="13">02 PULSE CRM</text><text x="462" y="0" class="mono light" font-size="13">03 ATELIER NOIR</text><text x="694" y="0" class="mono muted" font-size="13">NEXT → PROPOSAL FOLLOW UP</text>
</g>
<rect x="-320" y="0" width="260" height="360" fill="url(#accent)" opacity=".055" class="scan"/>
<path d="M44 340 H1156" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".55" class="dash"/>
</svg>